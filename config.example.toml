# Copy to ~/.claude-phone/config.toml. Every key is optional.
owner_name = "Sam"      # spoken and typed as "Sam"; the tools become call_sam and notify_sam
# lan_ip = "192.168.1.50"     # default: this computer's address. Pin it once the router reserves it
# lan_cidr = "192.168.1.0/24" # default: lan_ip's /24. Only phones in this range may register
desk_ext = "200"        # T31P, or the analog phone's adapter
softphone_ext = "201"   # Linphone
ring_ext = "200"        # what call_<name> rings; "201" while testing on Linphone
voicemail_ext = "500"
ring_seconds = 25       # keep ring + record + transcribe under Claude Code's 120 s auto-background
record_seconds = 60
callerid_max = 17       # T31P screen; 15 for an analog phone (the most analog caller ID carries)
# Voices. Default: "say" on a Mac, "piper" elsewhere. "elevenlabs" needs ELEVENLABS_API_KEY or the elevenlabs secret.
# tts_provider = "say"
say_voice = "Daniel"                # Mac
piper_voice = "en_GB-alan-medium"   # Linux/WSL: https://rhasspy.github.io/piper-samples/
# operator_provider = "say"         # dial 0; same default as tts_provider
# operator_voice = "Shelley (English (UK))"   # a say voice, Piper voice or ElevenLabs voice id to match

# Per-repo voices
# [repo_voices.lemon-stand]
# provider = "say"
# voice = "Fiona (Enhanced)"

# Per-repo ringtones (T31P Ring1-8). Unlisted repos get the least-used ring on first sight.
# [repo_ringtones]
# lemon-stand = 3
